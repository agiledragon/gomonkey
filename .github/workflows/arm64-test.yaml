name: arm64-test
on:
  push:
    branches: [ master ]
  pull_request:

jobs:
  test:
    name: test (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os:
          - macos-14            # darwin/arm64 (Apple Silicon)
          - ubuntu-24.04-arm    # linux/arm64
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.22'
      - name: Run tests
        run: go test ./... -gcflags=all=-N -l -count=1
